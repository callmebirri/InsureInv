name: Build Gradle Project

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean shadowJar

      - name: Package JAR
        run: |
          ZIP_NAME="InsureInv-${GITHUB_SHA}.zip"

          cd build/libs

          JAR_FILE=$(find . -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No JAR file found."
            exit 1
          fi

          zip "../../${ZIP_NAME}" "$JAR_FILE"

          echo "Created ${ZIP_NAME} containing ${JAR_FILE}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InsureInv-${{ github.sha }}
          path: InsureInv-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 7
